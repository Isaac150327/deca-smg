name: Daily DECA scan

on:
  schedule:
    # Two UTC schedules cover U.S. daylight and standard time. The first step
    # selects the one that is 3:45 p.m. in New York on that date.
    - cron: "45 19 * * 1-5"
    - cron: "45 20 * * 1-5"
    # One-time test: October 10, 2026 at 10:50 p.m. New York time. The schedule
    # syntax has no year field, so the first step also checks the exact date.
    - cron: "50 2 11 10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Select the New York 3:45 schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          run_scan=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_scan=true
          elif [[ "$EVENT_SCHEDULE" == "50 2 11 10 *" ]]; then
            if [[ "$(TZ=America/New_York date +%F)" == "2026-10-10" ]]; then
              run_scan=true
            fi
          else
            schedule_hour="${EVENT_SCHEDULE#* }"
            schedule_hour="${schedule_hour%% *}"
            new_york_offset="$(TZ=America/New_York date +%z)"
            if [[ "$new_york_offset" == "-0400" && "$schedule_hour" == "19" ]]; then
              run_scan=true
            elif [[ "$new_york_offset" == "-0500" && "$schedule_hour" == "20" ]]; then
              run_scan=true
            fi
          fi
          echo "run=$run_scan" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install scanner
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install .

      - name: Build universe and fetch snapshots
        if: steps.schedule.outputs.run == 'true'
        run: |
          deca-smg discover --maximum-tickers 500 --output data/universe.csv
          deca-smg fetch --tickers data/universe.csv --output data/snapshots.csv

      - name: Backtest and scan
        if: steps.schedule.outputs.run == 'true'
        run: |
          deca-smg backtest --input data/snapshots.csv --output-dir outputs/backtest
          deca-smg scan --input data/snapshots.csv --universe data/universe.csv --model outputs/backtest/model.joblib --output outputs/shortlist.csv

      - name: Publish Shortlist tab
        if: steps.schedule.outputs.run == 'true'
        env:
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
        run: deca-smg publish --input outputs/shortlist.csv --worksheet Shortlist

      - name: Save run files
        if: always() && steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deca-smg-${{ github.run_id }}
          path: |
            data/universe.csv
            data/snapshots.csv
            outputs/
          if-no-files-found: warn
          retention-days: 14
